<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semakan Tahun 1 2027 — SK Agama (MIS) Miri</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --hijau:#0f6b4a; --hijau2:#13875d; --emas:#c9a227; --bg:#f3f7f4; --kad:#fff;
    --teks:#1c2b24; --kabur:#5f6f67; --garis:#dde7e1; --merah:#b3261e; --merahbg:#fdecea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--teks)}
  header{background:linear-gradient(135deg,var(--hijau),var(--hijau2));color:#fff;padding:28px 16px 64px;text-align:center;position:relative}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--emas)}
  header small{display:block;letter-spacing:.14em;font-size:.72rem;opacity:.85;font-weight:600}
  header h1{margin:8px 0 4px;font-size:clamp(1.25rem,4.5vw,1.8rem);font-weight:800;line-height:1.25}
  header p{margin:0;opacity:.9;font-size:.92rem}
  main{max-width:560px;margin:-40px auto 40px;padding:0 16px}
  .kad{background:var(--kad);border-radius:16px;box-shadow:0 6px 24px rgba(15,107,74,.10);padding:22px;margin-bottom:16px}
  label{font-weight:700;font-size:.9rem;display:block;margin-bottom:8px}
  .baris{display:flex;gap:8px}
  input{flex:1;min-width:0;font:inherit;font-size:1.15rem;letter-spacing:.06em;padding:13px 14px;border:2px solid var(--garis);border-radius:12px;outline:none}
  input:focus{border-color:var(--hijau2)}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--hijau);color:#fff}
  button:disabled{opacity:.6;cursor:wait}
  .nota{font-size:.8rem;color:var(--kabur);margin-top:10px}
  .tahniah{text-align:center}
  .tahniah .ikon{font-size:2.6rem}
  .tahniah h2{margin:6px 0;color:var(--hijau);font-size:1.4rem}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:16px 0 0;font-size:.92rem}
  dt{color:var(--kabur)} dd{margin:0;font-weight:600;word-break:break-word}
  h3{font-size:1rem;margin:0 0 12px}
  .dok{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--garis);border-radius:12px;margin-bottom:10px;text-decoration:none;color:inherit;background:#fff;width:100%;text-align:left}
  .dok:hover{border-color:var(--hijau2);background:#f7fbf9}
  .dok .i{width:40px;height:40px;border-radius:10px;background:#e7f3ed;display:grid;place-items:center;font-size:1.2rem;flex:none}
  .dok b{display:block;font-size:.93rem} .dok span{font-size:.78rem;color:var(--kabur)}
  .dok.utama{border:2px solid var(--emas);background:#fffaf0}
  .amaran{background:#fff7e0;border-left:4px solid var(--emas);padding:12px;border-radius:8px;font-size:.88rem;margin-top:14px}
  .gagal{background:var(--merahbg);color:var(--merah);border-radius:12px;padding:14px;font-size:.92rem}
  .neutral{background:#eef2f0;border-radius:12px;padding:14px;font-size:.92rem}
  footer{text-align:center;color:var(--kabur);font-size:.75rem;padding:0 16px 30px}
  .tersembunyi{display:none}
</style>
</head>
<body>
<header>
  <small>SEKOLAH KEBANGSAAN AGAMA (MIS) MIRI</small>
  <h1>Semakan Kelayakan Masuk Tahun 1<br>Sesi Persekolahan 2027</h1>
  <p>Ujian Pemilihan Tahun Satu SABK Negeri Sarawak</p>
</header>

<main>
  <div class="kad">
    <form id="borang" autocomplete="off">
      <label for="ic">No. Kad Pengenalan / MyKid Calon</label>
      <div class="baris">
        <input id="ic" inputmode="numeric" placeholder="cth: 200412130554" maxlength="14" required>
        <button id="btn" type="submit">Semak</button>
      </div>
      <div class="nota">Masukkan 12 digit tanpa sengkang (-).</div>
    </form>
  </div>

  <div id="hasil"></div>
</main>

<footer>© 2026 SK Agama (MIS) Miri · Unit ICT</footer>

<script>
// >>> Tampal URL Web App Apps Script di sini (berakhir dengan /exec)
const API = 'https://script.google.com/macros/s/AKfycbxX4g4o-OaT4uld48tfXjt4ZHLy_PwIKNWjrZdmu2aD3T3V4-Lpsia5I-sGeiC60KfHwg/exec';

const $ = s => document.querySelector(s);
const hasil = $('#hasil');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let icSemasa = '';

$('#ic').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 12); });

async function panggil(params, cubaan = 2) {
  const url = API + '?' + new URLSearchParams(params).toString();
  for (let i = 0; i < cubaan; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) {
      if (i === cubaan - 1) throw e;
      await new Promise(res => setTimeout(res, 1500));
    }
  }
}

$('#borang').addEventListener('submit', async e => {
  e.preventDefault();
  const ic = $('#ic').value.replace(/\D/g, '');
  if (ic.length !== 12) { papar('<div class="gagal">No. kad pengenalan mesti 12 digit.</div>'); return; }
  icSemasa = ic;
  $('#btn').disabled = true; $('#btn').textContent = 'Menyemak…';
  papar('<div class="neutral">Sedang menyemak, sila tunggu…</div>');
  try {
    const d = await panggil({ ic });
    tunjuk(d);
  } catch (err) {
    papar('<div class="gagal">Sistem sibuk atau tiada sambungan internet. Sila cuba sebentar lagi.</div>');
  } finally {
    $('#btn').disabled = false; $('#btn').textContent = 'Semak';
  }
});

function papar(html) { hasil.innerHTML = '<div class="kad">' + html + '</div>'; }

function tunjuk(d) {
  if (d.status === 'tutup') return papar('<div class="neutral">' + esc(d.mesej || 'Semakan belum dibuka.') + '</div>');
  if (d.status === 'ic_salah') return papar('<div class="gagal">No. kad pengenalan tidak sah.</div>');
  if (d.status === 'tiada') return papar('<div class="gagal">Maaf, no. kad pengenalan ini tiada dalam senarai calon Ujian Pemilihan Tahun 1 2027. Sila semak semula nombor yang dimasukkan.</div>');
  if (d.status === 'tidak_layak') return papar(
    '<div class="neutral"><b>' + esc(d.nama) + '</b><br><br>' +
    'Terima kasih kerana menyertai Ujian Pemilihan Tahun 1 SABK. Dukacita dimaklumkan bahawa calon <b>tidak tersenarai</b> ' +
    'untuk tawaran kemasukan ke SK Agama (MIS) Miri bagi sesi 2027.</div>');
  if (d.status !== 'layak') return papar('<div class="gagal">' + esc(d.mesej || 'Ralat tidak dijangka.') + '</div>');

  const dok = (d.dokumen || []).map(x =>
    '<a class="dok" href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
    '<div class="i">📄</div><div><b>' + esc(x.nama) + '</b>' + (x.ket ? '<span>' + esc(x.ket) + '</span>' : '') + '</div></a>'
  ).join('');

  const surat = d.suratSedia
    ? '<button class="dok utama" id="btnSurat" type="button"><div class="i">🏅</div><div><b>Surat Tawaran Kemasukan</b><span>PDF · ' + esc(d.noRujukan) + '</span></div></button>'
    : '<div class="dok"><div class="i">⏳</div><div><b>Surat Tawaran Kemasukan</b><span>Sedang disediakan — sila semak semula kemudian.</span></div></div>';

  hasil.innerHTML =
    '<div class="kad tahniah"><div class="ikon">🎉</div><h2>TAHNIAH!</h2>' +
    '<div>Anak tuan/puan <b>LAYAK</b> ditawarkan tempat ke Tahun 1 di SK Agama (MIS) Miri bagi sesi persekolahan 2027.</div>' +
    '<dl><dt>Nama</dt><dd>' + esc(d.nama) + '</dd>' +
    '<dt>Angka Giliran</dt><dd>' + esc(d.giliran) + '</dd>' +
    '<dt>Tadika</dt><dd>' + esc(d.tadika || '-') + '</dd></dl>' +
    (d.tarikhAkhir ? '<div class="amaran">Sila berikan pengesahan menerima atau menolak tawaran ini <b>sebelum ' + esc(d.tarikhAkhir) + '</b>.</div>' : '') +
    '</div>' +
    '<div class="kad"><h3>Dokumen untuk dimuat turun</h3>' + surat + dok + '</div>';

  const b = $('#btnSurat');
  if (b) b.addEventListener('click', muatSurat);
}

async function muatSurat() {
  const b = $('#btnSurat');
  const asal = b.innerHTML;
  b.disabled = true;
  b.querySelector('span').textContent = 'Sedang memuat turun…';
  try {
    const d = await panggil({ action: 'surat', ic: icSemasa });
    if (d.status !== 'ok') throw new Error(d.status);
    const bin = atob(d.base64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url; a.download = d.namaFail || 'Surat_Tawaran_Tahun1_2027.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    b.innerHTML = asal;
  } catch (err) {
    b.innerHTML = asal;
    alert('Gagal memuat turun surat. Sila cuba lagi sebentar.');
  } finally {
    b.disabled = false;
  }
}
</script>
</body>
</html>
